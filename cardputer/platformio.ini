; WeDo 2.0 controller for the M5Stack Cardputer (original / v1.1).
; ESP-IDF + PlatformIO, development build only (unsigned, unencrypted).
; Settings mirror the Braid "cardputer" env, which runs on this hardware.

[platformio]
default_envs = cardputer_dev
src_dir = main

[env]
platform = espressif32@6.13.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Lenient globals: these also compile ESP-IDF sources. Strict flags are set
; per component in components/*/CMakeLists.txt.
build_flags =
    -Wall
    -Werror=return-type
    -Werror=implicit-fallthrough
    -Wno-error=format
board_build.partitions = partitions_8mb.csv

; StampS3 (ESP32-S3FN8, 8 MB flash, no PSRAM). Its only USB port is the
; chip's own USB-Serial/JTAG.
[env:cardputer_dev]
board = esp32-s3-devkitc-1
build_type = debug
build_flags = ${env.build_flags} -DDEVELOPMENT_BUILD=1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
